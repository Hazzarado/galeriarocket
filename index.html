<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria Rocket League</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="galeria">
    <div class="item destaque">
      <img src="https://www.rocketleague.com/images/evergreen/rocket-league-with-logo.jpg" alt="Capa do jogo">
      <div class="legenda">Capa do jogo</div>
    </div>

    <div class="item">
      <img src="https://static.wikia.nocookie.net/rocketleague/images/7/71/Octane_hero_art.jpg/revision/latest/scale-to-width/360?cb=20190924153027" alt="Octane">
      <div class="legenda">Octane</div>
    </div>

    <div class="item">
      <img src="https://static.wikia.nocookie.net/rocketleague/images/1/13/Dominus_hero_art.jpg/revision/latest/scale-to-width/360?cb=20190924152611" alt="Dominus">
      <div class="legenda">Dominus</div>
    </div>

    <div class="item">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT9g-m89xTReqmmmvR93QBmYD0osNUotUgtggqLQes4GA&s=10" alt="Fennec">
      <div class="legenda">Fennec</div>
    </div>

    <div class="item">
      <img src="https://p2.trrsf.com/image/fget/cf/1200/1200/middle/images.terra.com/2015/12/22/foto-1gamesversao-de-rocket-league-para-xbox-one.jpg" alt="Bola">
      <div class="legenda">Bola</div>
    </div>
  </div>

</body>
</html>
